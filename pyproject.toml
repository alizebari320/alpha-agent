[project]
name = "alpha-agent"
version = "0.1.0"
description = "Voice-driven computer-use agent for Fedora Linux. Offline wake word + STT/TTS, local planning, real desktop control."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Ali Arif Muhammed" }]
dependencies = [
    "keyring>=25.2",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "pillow>=12.3.0",
]

[project.scripts]
alpha = "alpha.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Colab notebooks mirror the official openWakeWord training notebook cell for
# cell (they use `!pip` magics and its import order on purpose), so they are not
# linted here. The Python they contain is exercised by scripts/train-wake-word.py.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S", "BLE", "PLW"]
# Deliberate, documented choices instead of accidents:
#   BLE001  broad excepts keep the always-on daemon alive (it never crashes on
#           a single bad device/API reply); errors are logged, not swallowed
#   S110    same for best-effort cleanup on shutdown
#   PLW1510 subprocess calls without check=True: we inspect returncode explicitly
ignore = [
    "BLE001",   # broad excepts keep the always-on daemon alive (errors are logged)
    "S110",     # best-effort cleanup on shutdown
    "PLW1510",  # subprocess without check=True: returncode is inspected explicitly
    "E501",     # line length is enforced by the formatter
    "S603", "S607",  # subprocess argv is built from our own constants, not user input
    "S310",     # urlopen only ever sees the https:// endpoints in alpha/models.py
    "S112",     # worker loops skip individual bad elements on purpose
    "SIM105", "SIM115",  # try/except-pass and explicit open() read more clearly here
    "PLW0603",  # module-level request counter in the vision IPC shim
]


[tool.ruff.lint.per-file-ignores]
# Tests legitimately unpack more than they assert on.
"tests/*" = ["RUF059", "S101"]
# Blender scene templates use `random` for procedural placement, not secrets.
"alpha/brain/blender_templates/*" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
